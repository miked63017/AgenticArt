[package]
name = "agenticart-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agenticart_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "agenticart-mcp-server"
path = "src/main.rs"

[dependencies]
agenticart-core = { workspace = true }
image = { workspace = true }
